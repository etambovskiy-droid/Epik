    <script>
      // Ensure window.fetch has both getter and setter for iframe extensions & tools
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return realFetch;
            },
            set: function(val) {
              realFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // If property is not configurable, ignore
        }
      })();
    </script>
